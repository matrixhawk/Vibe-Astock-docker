name: 发布 Docker 镜像

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/publish-image.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      vibe_astock_ref:
        description: 上游 Vibe-Astock ref
        required: true
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vibe-astock-docker
  VIBE_ASTOCK_REPO: https://github.com/simonlin1212/vibe-astock.git

jobs:
  publish:
    name: 构建并发布多架构镜像
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 启用 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 启用 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VIBE_ASTOCK_REPO=${{ env.VIBE_ASTOCK_REPO }}
            VIBE_ASTOCK_REF=${{ github.event_name == 'workflow_dispatch' && inputs.vibe_astock_ref || 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
