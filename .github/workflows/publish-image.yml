name: 发布 Docker 镜像

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker/**
      - scripts/check-upstream-v2.sh
      - .github/workflows/publish-image.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      vibe_astock_ref:
        description: 上游 Vibe-Astock ref
        required: true
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vibe-astock-docker
  VIBE_ASTOCK_REPO: https://github.com/simonlin1212/vibe-astock.git

jobs:
  check-upstream:
    name: 检查上游版本
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      should_publish: ${{ steps.decision.outputs.should_publish }}

    steps:
      - name: 读取上游 main SHA
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote "$VIBE_ASTOCK_REPO" refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "无法读取上游 main SHA: $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "上游 main: $sha"

      - name: 恢复已发布标记
        id: published
        uses: actions/cache/restore@v4
        with:
          path: .upstream-cache
          key: vibe-astock-upstream-main-${{ steps.upstream.outputs.sha }}

      - name: 恢复已失败标记
        id: failed
        uses: actions/cache/restore@v4
        with:
          path: .upstream-failure-cache
          key: vibe-astock-upstream-main-failed-${{ steps.upstream.outputs.sha }}-${{ github.sha }}

      - name: 判断是否需要发布
        id: decision
        shell: bash
        env:
          CACHE_HIT: ${{ steps.published.outputs.cache-hit }}
          FAILED_CACHE_HIT: ${{ steps.failed.outputs.cache-hit }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && ("$CACHE_HIT" == "true" || "$FAILED_CACHE_HIT" == "true") ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "上游 SHA 已成功发布或已记录失败，跳过本次定时构建。"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "本次事件需要构建并推送镜像。"
          fi

  publish:
    name: 构建并发布多架构镜像
    runs-on: ubuntu-latest
    needs: check-upstream
    if: >-
      always() &&
      needs.check-upstream.result == 'success' &&
      (github.event_name != 'schedule' || needs.check-upstream.outputs.should_publish == 'true')

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 确定上游构建 ref
        id: build_ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_REF: ${{ inputs.vibe_astock_ref }}
          UPSTREAM_SHA: ${{ needs.check-upstream.outputs.upstream_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_REF" != "main" ]]; then
            ref="$MANUAL_REF"
          else
            ref="$UPSTREAM_SHA"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "构建上游 ref: $ref"

      - name: 校验上游 v2 结构
        id: upstream_version
        shell: bash
        env:
          BUILD_REF: ${{ steps.build_ref.outputs.ref }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --filter=blob:none --no-checkout "$VIBE_ASTOCK_REPO" "$tmp"
          git -C "$tmp" fetch --depth 1 origin "$BUILD_REF"
          git -C "$tmp" checkout --detach FETCH_HEAD
          sh scripts/check-upstream-v2.sh "$tmp"
          version="$(jq -r '.version // empty' "$tmp/desktop/package.json")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "无法从上游 desktop/package.json 读取有效版本号: $version" >&2
            exit 1
          fi
          upstream_sha="$(git -C "$tmp" rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha12=${upstream_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "上游应用版本: $version"
          echo "上游源码 SHA: $upstream_sha"

      - name: 启用 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 启用 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ steps.upstream_version.outputs.version }}
            type=raw,value=${{ steps.upstream_version.outputs.version }}
            type=raw,value=upstream-${{ steps.upstream_version.outputs.version }}-${{ steps.upstream_version.outputs.sha12 }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.build_ref.outputs.ref }}
            org.opencontainers.image.version=${{ steps.upstream_version.outputs.version }}
            org.opencontainers.image.title=Vibe AStock

      - name: 构建并推送镜像
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VIBE_ASTOCK_REPO=${{ env.VIBE_ASTOCK_REPO }}
            VIBE_ASTOCK_REF=${{ steps.build_ref.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vibe-astock-v2
          cache-to: type=gha,mode=max,scope=vibe-astock-v2

      - name: 准备上游版本标记
        if: ${{ success() && steps.build_ref.outputs.ref == needs.check-upstream.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream-cache
          printf '%s\n' "${{ needs.check-upstream.outputs.upstream_sha }}" > .upstream-cache/main.sha

      - name: 保存已发布标记
        if: ${{ success() && steps.build_ref.outputs.ref == needs.check-upstream.outputs.upstream_sha }}
        uses: actions/cache/save@v4
        with:
          path: .upstream-cache
          key: vibe-astock-upstream-main-${{ needs.check-upstream.outputs.upstream_sha }}

      - name: 准备上游失败标记
        if: ${{ always() && github.event_name == 'schedule' && steps.publish.outcome == 'failure' && steps.build_ref.outputs.ref == needs.check-upstream.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream-failure-cache
          printf '%s\n' "${{ needs.check-upstream.outputs.upstream_sha }}" > .upstream-failure-cache/main.sha

      - name: 保存上游失败标记
        if: ${{ always() && github.event_name == 'schedule' && steps.publish.outcome == 'failure' && steps.build_ref.outputs.ref == needs.check-upstream.outputs.upstream_sha }}
        uses: actions/cache/save@v4
        with:
          path: .upstream-failure-cache
          key: vibe-astock-upstream-main-failed-${{ needs.check-upstream.outputs.upstream_sha }}-${{ github.sha }}
