services:
  vibe-astock:
    image: ${IMAGE_NAME:-ghcr.io/matrixhawk/vibe-astock-docker:latest}
    pull_policy: always
    ports:
      - "${HOST_PORT:-5898}:8080"
    environment:
      HOME: /data
      VRA_DATA_ROOT: /data/.local
      VRA_UI_PORT: 8080
      VRA_API_PORT: 8770
      VRA_PYTHON: /opt/venv/bin/python
      VRA_LAN: ${VRA_LAN:-1}
      VRA_SCHEDULER: ${VRA_SCHEDULER:-on}
      VRA_API_TOKEN: ${VRA_API_TOKEN:-}
      VRA_REMOTE: ${VRA_REMOTE:-}
      VRA_ACCESS_TOKEN: ${VRA_ACCESS_TOKEN:-}
      VRA_PUBLIC_URL: ${VRA_PUBLIC_URL:-}
      VRA_PROVIDER: ${VRA_PROVIDER:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SELFHOSTED_API_KEY: ${SELFHOSTED_API_KEY:-}
    volumes:
      - vibe_astock_data:/data
    restart: unless-stopped

volumes:
  vibe_astock_data:
